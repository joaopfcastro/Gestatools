    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-touch-fullscreen" content="yes" />
    <meta name="apple-mobile-web-app-title" content="GestaTools" />
    <meta name="format-detection" content="telephone=no" />
    <script>
      (function() {
        var lightColor = '#F2F2F7';
        var darkColor = '#000000';
        var savedSettings = localStorage.getItem('gestatools_settings');
        var theme = 'system';
        var isDark = false;
        
        if (savedSettings) {
          try {
            var settings = JSON.parse(savedSettings);
            if (settings.theme) theme = settings.theme;
          } catch (e) {}
        }
        
        if (theme === 'dark') {
          isDark = true;
        } else if (theme === 'light') {
          isDark = false;
        } else {
          isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        }
        
        var activeColor = isDark ? darkColor : lightColor;
        var colorScheme = isDark ? 'dark' : 'light';
        var statusBarStyle = isDark ? 'black-translucent' : 'default';

        if (isDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }

        document.documentElement.style.colorScheme = colorScheme;
        document.documentElement.style.backgroundColor = activeColor;
        
        // Remove existing theme/color-scheme metas
        var metas = document.querySelectorAll('meta[name="theme-color"], meta[name="color-scheme"], meta[name="apple-mobile-web-app-status-bar-style"]');
        for (var i = 0; i < metas.length; i++) {
          metas[i].remove();
        }

        var head = document.head || document.getElementsByTagName('head')[0];
        if (head) {
          var sMeta = document.createElement('meta');
          sMeta.name = 'apple-mobile-web-app-status-bar-style';
          sMeta.content = statusBarStyle;
          sMeta.id = 'status-bar-style-meta';
          head.appendChild(sMeta);

          var cMeta = document.createElement('meta');
          cMeta.name = 'color-scheme';
          cMeta.content = theme === 'system' ? 'light dark' : colorScheme;
          cMeta.id = 'color-scheme-meta';
          head.appendChild(cMeta);

          if (theme === 'system') {
            var lm = document.createElement('meta');
            lm.name = 'theme-color';
            lm.media = '(prefers-color-scheme: light)';
            lm.content = lightColor;
            head.appendChild(lm);

            var dm = document.createElement('meta');
            dm.name = 'theme-color';
            dm.media = '(prefers-color-scheme: dark)';
            dm.content = darkColor;
            head.appendChild(dm);

            var tm = document.createElement('meta');
            tm.name = 'theme-color';
            tm.content = activeColor;
            tm.id = 'theme-color-meta';
            head.appendChild(tm);
          } else {
            var lm2 = document.createElement('meta');
            lm2.name = 'theme-color';
            lm2.media = '(prefers-color-scheme: light)';
            lm2.content = activeColor;
            head.appendChild(lm2);

            var dm2 = document.createElement('meta');
            dm2.name = 'theme-color';
            dm2.media = '(prefers-color-scheme: dark)';
            dm2.content = activeColor;
            head.appendChild(dm2);

            var tm2 = document.createElement('meta');
            tm2.name = 'theme-color';
            tm2.content = activeColor;
            tm2.id = 'theme-color-meta';
            head.appendChild(tm2);
          }
        }
      })();
    </script>

  <body class="h-full overflow-hidden" data-mode="connect">
    <script>
      (function() {
        var isThemeReload = false;
        var themeLabel = 'Alternando tema...';
        try {
          isThemeReload = sessionStorage.getItem('gestatools_theme_reloading') === 'true';
          var savedLabel = sessionStorage.getItem('gestatools_theme_label');
          if (savedLabel) themeLabel = savedLabel;
        } catch (e) {}

        var isDark = document.documentElement.classList.contains('dark');
        var activeBg = isDark ? '#000000' : '#F2F2F7';
        var cardBg = isDark ? '#1C1C1E' : '#FFFFFF';
        var cardBorder = isDark ? 'rgba(255, 255, 255, 0.1)' : 'rgba(0, 0, 0, 0.08)';
        var textColor = isDark ? '#F2F2F7' : '#1C1C1E';
        var spinnerColor = isDark ? '#38BDF8' : '#0284C7';

        if (isDark) {
          document.body.classList.add('dark');
          document.body.style.backgroundColor = '#000000';
          document.body.style.colorScheme = 'dark';
        } else {
          document.body.classList.remove('dark');
          document.body.style.backgroundColor = '#F2F2F7';
          document.body.style.colorScheme = 'light';
        }

        if (isThemeReload) {
          var curtain = document.createElement('div');
          curtain.id = 'theme-curtain';
          curtain.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;background-color:' + activeBg + ';z-index:99999;pointer-events:none;transition:opacity 0.22s cubic-bezier(0.4, 0, 0.2, 1);opacity:1;display:flex;align-items:center;justify-content:center;';
          
          curtain.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px 24px;border-radius:20px;background-color:' + cardBg + ';box-shadow:0 12px 36px rgba(0,0,0,0.18);border:1px solid ' + cardBorder + ';color:' + textColor + ';font-family:-apple-system,BlinkMacSystemFont,\'SF Pro Text\',\'Inter\',sans-serif;">' +
            '<svg style="width:28px;height:28px;animation:gt-spin 0.8s linear infinite;" viewBox="0 0 24 24" fill="none" stroke="' + spinnerColor + '" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">' +
              '<path d="M21 12a9 9 0 1 1-6.219-8.56"/>' +
            '</svg>' +
            '<span style="font-size:13px;font-weight:600;letter-spacing:-0.2px;">' + themeLabel + '</span>' +
          '</div>';

          var styleEl = document.createElement('style');
          styleEl.textContent = '@keyframes gt-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }';
          document.head.appendChild(styleEl);

          document.body.appendChild(curtain);
        }
      })();
    </script>
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.log('SW registration note:', err);
          });
        });
      }
