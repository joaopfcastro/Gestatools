    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" id="theme-color-meta" content="#F2F2F7" />
    <meta name="color-scheme" id="color-scheme-meta" content="light" />
    <meta name="darkreader-lock" />
    <meta name="nightmode" content="disable" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" id="status-bar-style-meta" content="default" />
    <meta name="apple-mobile-web-app-title" content="GestaTools" />
    <script>
      (function() {
        const isDevHost = window.location.hostname.includes('-dev-') || 
                          window.location.hostname.includes('-pre-') || 
                          window.location.hostname.includes('run.app') || 
                          window.location.hostname.includes('localhost') || 
                          window.location.hostname.includes('127.0.0.1');

        if ('serviceWorker' in navigator) {
          if (isDevHost) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              for (let registration of registrations) {
                registration.unregister();
              }
            });
            if (window.caches) {
              caches.keys().then(function(names) {
                for (let name of names) {
                  caches.delete(name);
                }
              });
            }
          }
        }

        const savedSettings = localStorage.getItem('gestatools_settings');
        let isDark = false;
        if (savedSettings) {
          try {
            const settings = JSON.parse(savedSettings);
            if (settings.theme === 'dark') {
              isDark = true;
            } else if (settings.theme === 'system' || !settings.theme) {
              isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            }
          } catch (e) {}
        } else {
          isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        }
        
        const themeColor = isDark ? '#000000' : '#F2F2F7';
        const statusBarStyle = isDark ? 'black-translucent' : 'default';
        const colorScheme = isDark ? 'dark' : 'light';

        if (isDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }

        document.documentElement.style.colorScheme = colorScheme;
        document.documentElement.style.backgroundColor = themeColor;
        
        const themeMeta = document.getElementById('theme-color-meta');
        if (themeMeta) themeMeta.setAttribute('content', themeColor);

        const statusMeta = document.getElementById('status-bar-style-meta');
        if (statusMeta) statusMeta.setAttribute('content', statusBarStyle);

        const schemeMeta = document.getElementById('color-scheme-meta');
        if (schemeMeta) schemeMeta.setAttribute('content', colorScheme);
      })();
    </script>

  <body class="h-full overflow-hidden" data-mode="connect">
    <script>
      if (document.documentElement.classList.contains('dark')) {
        document.body.classList.add('dark');
        document.body.style.backgroundColor = '#000000';
        document.body.style.colorScheme = 'dark';
      } else {
        document.body.classList.remove('dark');
        document.body.style.backgroundColor = '#F2F2F7';
        document.body.style.colorScheme = 'light';
      }
    </script>
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && !window.location.hostname.includes('-dev-') && !window.location.hostname.includes('-pre-') && !window.location.hostname.includes('run.app') && !window.location.hostname.includes('localhost') && !window.location.hostname.includes('127.0.0.1')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.log('SW registration failed:', err);
          });
        });
      }
    </script>
